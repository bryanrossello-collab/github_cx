    <script>
      (function() {
        try {
          const themeKey = 'csmcc:dark';
          const legacyKeys = ['renewals_dashboard_theme_v2', 'cc_intel_dashboard_theme_v1'];
          let stored = localStorage.getItem(themeKey);
          if (stored === null) {
            for (const key of legacyKeys) {
              const legacy = localStorage.getItem(key);
              if (legacy === 'dark' || legacy === 'light') {
                stored = legacy === 'dark' ? 'true' : 'false';
                localStorage.setItem(themeKey, stored);
                break;
              }
            }
          }
          const normalized = stored === 'true' || stored === 'dark'
            ? 'dark'
            : stored === 'false' || stored === 'light'
              ? 'light'
              : null;
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          const shouldDark = normalized === 'dark' || (normalized === null && prefersDark);
          if (shouldDark) document.documentElement.classList.add('dark');
        } catch (e) {
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        }
      })();
    </script>
    <!--
      The original macOS install shipped a script here that probed
      http://127.0.0.1:4774 and redirected to the unified Local App Server.
      That logic is intentionally removed in the container build: the page
      is now served directly by this image's own Express server (on whatever
      port the platform assigns via $PORT), so there is nothing to redirect
      to.
    -->

    <!--
      Local App Server "Ask Claude" probe.
      Loads the shared insights side-panel client (/static/insights-client.js)
      when the server is reachable AND has this app registered. Silent no-op
      otherwise. App code can update window.__VIBE_CONTEXT__ at any time;
      the floating button reads it on click.
    -->
    <script>
      (function vibeInsightsProbe() {
        if (typeof window === "undefined" || typeof fetch !== "function") return;
        var SERVER = (window.location.protocol === "http:" || window.location.protocol === "https:")
          ? window.location.origin : "http://127.0.0.1:4774";
        var APP_ID = "renewals";
        var PROBE_TIMEOUT_MS = 800;
        var ctrl = (typeof AbortController === "function") ? new AbortController() : null;
        var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, PROBE_TIMEOUT_MS);
        var opts = { cache: "no-store" };
        if (ctrl) opts.signal = ctrl.signal;
        fetch(SERVER + "/api/health", opts)
          .then(function (r) { clearTimeout(timer); return r && r.ok ? r.json() : null; })
          .then(function (j) {
            if (!j || !j.apps || j.apps.indexOf(APP_ID) === -1) return;
            loadInsightsClient();
          })
          .catch(function () { clearTimeout(timer); });
        function loadInsightsClient() {
          if (window.VibeInsights && window.VibeInsights.__loaded) {
            installFab();
            return;
          }
          var s = document.createElement("script");
          s.src = SERVER + "/static/insights-client.js";
          s.async = true;
          s.onload = installFab;
          s.onerror = function () { try { console.warn("[renewals] insights-client.js failed to load"); } catch (_) {} };
          (document.head || document.documentElement).appendChild(s);
        }
        function installFab() {
          try {
            if (!window.VibeInsights) return;
            window.VibeInsights.installFloatingButton({
              label: "Ask Claude",
              getContext: function () {
                var ctx = window.__VIBE_CONTEXT__ || {};
                return {
                  appId: APP_ID,
                  scope: ctx.scope || null,
                  rows: Array.isArray(ctx.rows) ? ctx.rows : [],
                  snapshotId: ctx.snapshotId || null,
                  suggestions: ctx.suggestions || [
                    "Where should I focus this quarter's renewal calls?",
                    "Summarise ELT Forecast vs BU FC variance.",
                    "Which accounts have stale notes and a near-term renewal?"
                  ],
                };
              },
            });
          } catch (e) { try { console.warn("[renewals] installFloatingButton failed", e); } catch (_) {} }
        }
      })();
    </script>

      /* Splash gate */

        overflow: hidden;

      @keyframes loading-progress-slide {

      /* ---------- Mobile / narrow-viewport layout ----------
         Reference: Mobile Design.md (Patterns 1, 3, 5, 9)
         - Tab bars: horizontally scrollable with hidden scrollbar
           (NEVER wrap -- multi-row tabs are confusing on phones).
         - Header: split into rows on mobile via flex-wrap on
           .header-row; tabs get their own full-width row.
         - Touch targets: min 44px on all clickable elements at <=640px.
         - Desktop layout (>=640px) is preserved pixel-for-pixel.
      */

      /* Hidden-scrollbar utility used by horizontally scrollable tab/pill rows.
         Cross-browser: WebKit, Firefox, legacy Edge. */
      .scroll-hide::-webkit-scrollbar { display: none; }
      .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }

      /* Tabs container: always single-row, horizontal scroll if too wide. */
      .tabs {
        max-width: 100%;
        overflow-x: auto;
        -ms-overflow-style: none;
        scrollbar-width: none;
        flex-wrap: nowrap;
      }
      .tabs::-webkit-scrollbar { display: none; }
      .tab { white-space: nowrap; flex: 0 0 auto; }

      @media (max-width: 640px) {
        /* Header: stack title / right-cluster on row 1; tabs on row 2. */
        .header-shell .header-row {
          height: auto;
          min-height: 0;
          flex-wrap: wrap;
          row-gap: 0.45rem;
          column-gap: 0.5rem;
          padding-top: 0.55rem;
          padding-bottom: 0.55rem;
          align-items: center;
        }
        .header-shell .header-title-block {
          min-width: 0 !important;
          flex: 1 1 auto;
          gap: 0.55rem;
        }
        .header-shell .header-title-logo {
          width: 32px !important;
          height: 32px !important;
        }
        .header-shell .header-title-logo svg {
          width: 18px;
          height: 18px;
        }
        .header-shell .header-title-text {
          font-size: 1.05rem !important;
          line-height: 1.15;
        }
        /* Tabs row: full-width below the title; horizontal scroll, no wrap. */
        .header-shell .header-tabs-block {
          flex: 1 1 100%;
          justify-content: flex-start !important;
          order: 3;
          min-width: 0;
        }
        .header-shell .header-tabs-block .tabs {
          width: 100%;
          padding: 0.2rem 0.25rem;
        }
        .header-shell .header-tabs-block .tab {
          padding: 0.55rem 0.85rem;   /* 44px tap target */
          font-size: 0.78rem;
        }
        /* Right cluster: stays on row 1 next to the title; pills shrink. */
        .header-shell .header-right-block {
          min-width: 0 !important;
          flex: 0 1 auto;
          flex-wrap: wrap;
          row-gap: 0.3rem;
          justify-content: flex-end !important;
          order: 2;
        }
        .header-shell .header-right-block .pill {
          font-size: 9px;
          padding: 0.22rem 0.5rem;
          min-height: 32px;
        }
        /* Touch targets: enlarge icon-only buttons & small action buttons. */
        .iconbtn {
          width: 44px;
          height: 44px;
          min-width: 44px;
          min-height: 44px;
        }
        .iconbtn svg { width: 18px !important; height: 18px !important; }
        .smallbtn {
          min-height: 40px;
          padding-top: 0.5rem;
          padding-bottom: 0.5rem;
        }
        .smallbtn-xs {
          min-height: 36px;
          padding-top: 0.4rem;
          padding-bottom: 0.4rem;
        }
        .chip {
          min-height: 40px;
          padding-top: 0.5rem;
          padding-bottom: 0.5rem;
        }
        /* Filter strip: search gets its own row, full-width. */
        .filter-inline { flex-wrap: wrap; row-gap: 0.4rem; column-gap: 0.4rem; }
        .filter-main-search {
          flex: 1 1 100%;
          min-width: 0;
          height: 44px;
          font-size: 0.85rem;
        }
        /* Modal close buttons: enforce 44x44 tap area. */
        .acct-modal-hdr button,
        .filter-sheet-head button { min-width: 44px; min-height: 44px; }
      }

      /* ------------------------------------------------------------------
         Phase 1 perf cleanup -- "kill the glass tax"
         ------------------------------------------------------------------
         backdrop-filter: blur() is the dominant paint cost in this app and
         was producing visible lag on tab switches and modal open/close. The
         block below force-strips it from every non-popup glass surface.
         The pop-up family (modals, account detail panel, filter sheet,
         refresh overlay) is already a solid surface via --popup-bg -- see
         Renewals/AGENTS.md "Popup Surface Exception". This rule purposely
         lives at the very end of <style> so it wins by source order; no
         !important required.
         If a new "glass-*" class is added, add its selector here too. */
      .card,
      .csm-surface .card,
      .csm-card, .csm-card-sheen, .csm-kpi, .csm-strip,
      .smallbtn, .iconbtn, .chip, .pill,
      .filter-trigger, .filter-menu, .filter-input,
      .hero, .hero-metric, .header-shell, .metric-card, .panel-head,
      .tabs, .tab.active, .badge, .drawer,
      .acct-hdr-pill, .acct-kpi, .acct-summary-box,
      .glass-kpi, .glass-strip, .glass-sidebar-item, .glass-fact, .seg-ctrl,
      .glass-comparison, .glass-thead, .glass-card-surface,
      .splash-card, .splash-step, .splash-panel,
      .export-delete-btn {
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      /* ------------------------------------------------------------------
         Responsive-visibility fix for the bundled Tailwind subset.
         ------------------------------------------------------------------
         vendor/tailwind.min.css was assembled from multiple purge chunks
         and the `@media (min-width: 1024px)` wrapper around the "lg:*"
         utilities got dropped for one chunk. That leaves `.lg\:block`
         (and friends) applying UNCONDITIONALLY at every viewport width,
         which — because it has the same specificity as `.hidden` and
         comes later in the file — wins the cascade and defeats
         `hidden lg:block` / `lg:hidden` responsive toggles everywhere
         they're combined (e.g. the Region tab's desktop sidebar leaking
         into the mobile layout and corrupting the flex-1 column's width).
         These compound-class overrides have higher specificity than any
         single-class rule in the vendor file, so they win regardless of
         source order, without having to touch the 2.9 MB vendor CSS. */
      .hidden.lg\:block,
      .hidden.md\:block,
      .hidden.sm\:block,
      .hidden.lg\:flex,
      .hidden.md\:flex,
      .hidden.sm\:flex,
      .hidden.lg\:inline-flex,
      .hidden.lg\:table-cell {
        display: none !important;
      }
      @media (min-width: 640px) {
        .hidden.sm\:block { display: block !important; }
        .hidden.sm\:flex { display: flex !important; }
      }
      @media (min-width: 768px) {
        .hidden.md\:block { display: block !important; }
        .hidden.md\:flex { display: flex !important; }
      }
      @media (min-width: 1024px) {
        .hidden.lg\:block { display: block !important; }
        .hidden.lg\:flex { display: flex !important; }
        .hidden.lg\:inline-flex { display: inline-flex !important; }
        .hidden.lg\:table-cell { display: table-cell !important; }
      }
      @media (min-width: 1024px) {
        .lg\:hidden { display: none !important; }
      }

  <body class="theme-transition">
    <div id="root"></div>

    <!-- React + ReactDOM (vendored, offline) -->
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>

    <!-- PapaParse (vendored, offline) -->
    <script src="vendor/papaparse.min.js"></script>

    <!-- Server-first data: intercept CSV fetches → Postgres parsed rows -->
    <script src="vendor/vibe-call-keys.js"></script>
    <script src="vendor/vibe-tab-access.js"></script>
    <script src="vendor/vibe-server-data.js"></script>
    <script src="vendor/vibe-session-lock.js"></script>

    <!-- App (compiled from app.jsx by ./build.sh) -->
    <script src="vendor/app.js?v=20260807b"></script>

    <!--
      Container-mode toolbar tweaks. Mounted after the React app so we can
      safely modify the DOM without fighting React. Three things happen:
        1. The "Import CSV" button (top-right) is hidden — all upload /
           import lives behind the SSO-gated /admin page (linked from user menu).
        2. The Settings popup is sanitised on every render: any item
           whose visible text matches the BLOCKLIST below is hidden.
           This kills the legacy macOS-only "Mobile snapshot" controls
           and the "Import Notes" / "Import report" entries that the
           bundled React app still renders.
        3. Re-runs on a short loop and via a MutationObserver because the
           React app re-renders fragments when state changes (popup open,
           theme switch, tab change) — without this our hides would get
           wiped on every re-render.
    -->
    <script>
      (function adminTabInjection() {
        // ---- Performance budget --------------------------------------
        // The MutationObserver below sees every DOM mutation React
        // makes — that can be hundreds per second on a busy dashboard.
        // We debounce so applyAll runs at MOST once per 500 ms, and
        // each helper inside applyAll exits early when its work is
        // already done. We also disconnect the observer briefly while
        // our own DOM mutations run, so we don't re-trigger ourselves.
        const APPLY_THROTTLE_MS = 500;
        let _applyTimer = null;
        let _applyInFlight = false;
        let _scheduledApplyAt = 0;

        // Cached DOM lookups. They're expensive (querySelectorAll over
        // a large React tree) and the targets don't move once mounted,
        // so we cache them and re-resolve only when the cached node is
        // detached from the document.
        let _cachedTabsContainer = null;
        let _cachedKpiGrid = null;
        function getCachedTabsContainer() {
          if (_cachedTabsContainer && document.body.contains(_cachedTabsContainer)) {
            return _cachedTabsContainer;
          }
          _cachedTabsContainer = findTabsContainer();
          return _cachedTabsContainer;
        }
        function getCachedKpiGrid() {
          if (_cachedKpiGrid && document.body.contains(_cachedKpiGrid)) {
            return _cachedKpiGrid;
          }
          _cachedKpiGrid = findKpiGrid();
          return _cachedKpiGrid;
        }

        // Visible text that the script hides wherever it appears. Match is
        // case-insensitive after lowercasing + trimming, so "MOBILE
        // SNAPSHOT" (CSS-uppercased) matches "Mobile snapshot" (the
        // underlying React string).
        const HIDE_LOWERCASE = new Set([
          'import csv',
          'import csv report',
          'import report',
          'import notes',
          'import notes json',
          'mobile snapshot',
          'show mobile.html in finder',
          'step 2: import your notes pack',
          // Splash gate Step 2: routes the user to JSON import. Admins
          // do this from /admin now, so the whole step is hidden.
          'match insights to accounts',
        ]);

        // For each heading match, ALSO hide every sibling forward until
        // the next heading (so we collapse the whole section, not just
        // the title bar).
        const SECTION_HEADERS = new Set([
          'mobile snapshot',
          'step 2: import your notes pack',
          'import notes json',
        ]);

        function hideElementCleanly(el) {
          if (!el) return;
          el.style.display = 'none';
          el.setAttribute('aria-hidden', 'true');
          el.setAttribute('data-vibe-hidden', '1');
        }

        function isHeading(el) {
          return el && el.tagName && /^H[1-6]$/.test(el.tagName);
        }

        function looksLikeHeading(el) {
          if (!el) return false;
          if (isHeading(el)) return true;
          // The Settings popup uses styled <div>s as section headers
          // ("DATA", "NOTES", "MOBILE SNAPSHOT", "PREFERENCES",
          // "BACKGROUND"). The splash gate uses 'splash-step-title' for
          // each numbered step. Detect both via class hints + short text.
          const cls = el.className || '';
          if (typeof cls !== 'string') return false;
          const text = (el.textContent || '').trim();
          if (text.length === 0 || text.length > 60) return false;
          return /uppercase|tracking|section|label|head|title|step|splash/i.test(cls);
        }

        function hideSectionAfter(heading) {
          // Hide the heading itself.
          hideElementCleanly(heading);
          // Then hide every following sibling up to (but not including)
          // the next heading-like element. This collapses the section
          // body without nuking the rest of the popup.
          let cursor = heading.nextElementSibling;
          while (cursor && !looksLikeHeading(cursor)) {
            const next = cursor.nextElementSibling;
            hideElementCleanly(cursor);
            cursor = next;
          }
        }

        // Class names that mark a row/section wrapper. EXACT match (not
        // substring) so 'splash-step-title' is not mistaken for the row
        // wrapper 'splash-step'.
        const ROW_CLASSES = new Set([
          'splash-step',
          'splash-row',
          'step-row',
          'setting-row',
          'menu-item',
          'popup-row',
          'panel-row',
        ]);

        function findRowContainer(el) {
          let cur = el;
          let hops = 0;
          while (cur && cur !== document.body && hops < 8) {
            if (cur.matches && cur.matches('section, fieldset, [role="group"]')) {
              return cur;
            }
            const cls = (cur.className && typeof cur.className === 'string') ? cur.className : '';
            // Exact class match — splash-step matches splash-step but not
            // splash-step-title / splash-step-body.
            const parts = cls.split(/\s+/);
            for (const p of parts) {
              if (ROW_CLASSES.has(p)) return cur;
            }
            cur = cur.parentElement;
            hops++;
          }
          return null;
        }

        function sanitiseBlocklisted() {
          // Pass 1 — buttons / links / menu items by exact lowercase match.
          document.querySelectorAll('button, a, [role="menuitem"]').forEach(function (el) {
            if (el.getAttribute('data-vibe-hidden') === '1') return;
            const text = (el.textContent || '').trim().toLowerCase();
            if (HIDE_LOWERCASE.has(text)) {
              // If the button lives inside a splash/menu row, hide the
              // whole row so any subtitle / icon goes with it.
              const row = findRowContainer(el);
              hideElementCleanly(row || el);
            }
          });

          // Pass 2 — also catch matching text that lives in non-button
          // elements (subtitles, span labels). When the matching text is
          // inside a row container, hide the row.
          document.querySelectorAll('div, span, p, h1, h2, h3, h4, h5, h6').forEach(function (el) {
            if (el.getAttribute('data-vibe-hidden') === '1') return;
            const text = (el.textContent || '').trim().toLowerCase();
            if (!text) return;
            // Avoid hiding huge containers — only match if THIS element
            // (not just a descendant) holds the literal text.
            if (text.length > 80) return;
            if (!HIDE_LOWERCASE.has(text)) return;
            const row = findRowContainer(el);
            hideElementCleanly(row || el);
          });

          // Pass 3 — section headers (DATA / NOTES / MOBILE SNAPSHOT etc.)
          // For these we ALSO want the content below to disappear.
          const candidates = document.querySelectorAll(
            'h1, h2, h3, h4, h5, h6, div, span, p'
          );
          candidates.forEach(function (el) {
            if (el.getAttribute('data-vibe-hidden') === '1') return;
            const text = (el.textContent || '').trim().toLowerCase();
            if (!SECTION_HEADERS.has(text)) return;
            if (!isHeading(el) && !looksLikeHeading(el)) return;
            const sectionContainer = el.closest('section, fieldset, [role="group"]');
            if (sectionContainer && sectionContainer !== document.body) {
              hideElementCleanly(sectionContainer);
            } else {
              const row = findRowContainer(el);
              if (row) hideElementCleanly(row);
              else hideSectionAfter(el);
            }
          });
        }

        function findTabsContainer() {
          const buttons = document.querySelectorAll('button');
          for (const btn of buttons) {
            const t = (btn.textContent || '').trim();
            if (t === 'Region') return btn.parentElement;
          }
          return null;
        }

        // NOTE: rewireSplashCTA() was removed with the onboarding wizard/splash
        // (v3.3). Data loading now lives entirely in /admin, so there is no
        // longer a splash CSV CTA to redirect.

        // ---- ELT Forecast decomposition: CS + Renewals ------------------
        //
        // Two places this surfaces:
        //
        //  1. **Account modal** — inject CS Forecast + Renewals Forecast
        //     inputs above the existing ELT FORECAST input. Saving happens
        //     on blur to /api/renewals/account-forecasts/{account_id}.
        //     The ELT FORECAST input gets the computed sum so the rest of
        //     the dashboard's logic (KPI rollups in the bundle, exports,
        //     etc.) keeps using the same field — we just decompose where
        //     the data comes from.
        //
        //  2. **Dashboard KPI strip** — a second row of tiles (CS CALL,
        //     RENEWALS CALL, ELT CALL computed) showing global totals
        //     from /api/renewals/account-forecasts/totals.
        //
        // Everything is server-backed (Postgres) so values persist across
        // browser sessions / devices / users.

        const ACCT_FC_TTL_MS = 15_000;
        let _acctFcTotalsCache = null;
        let _acctFcTotalsLastFetch = 0;
        let _acctFcTotalsScopeKey = '';
        let _currentUser = null;

        window.addEventListener('renewals-scope-changed', function () {
          _acctFcTotalsScopeKey = '';
          refreshEltTiles(true);
        });

        window.addEventListener('renewals-acctfc-changed', function () {
          _acctFcTotalsCache = null;
          _acctFcTotalsLastFetch = 0;
          _acctFcTotalsScopeKey = '';
          refreshEltTiles(true);
        });

        window.addEventListener('renewals-call-rollup-changed', function () {
          applyEltKpiValues();
        });

        const ARR_PRESETS = [
          { id: 'all', label: 'All ARR', min: null, max: null },
          { id: 'under10k', label: 'Under $10K', min: 0, max: 10000 },
          { id: '10k-50k', label: '$10K – $50K', min: 10000, max: 50000 },
          { id: '50k-100k', label: '$50K – $100K', min: 50000, max: 100000 },
          { id: '100k-500k', label: '$100K – $500K', min: 100000, max: 500000 },
          { id: '500k-1m', label: '$500K – $1M', min: 500000, max: 1000000 },
          { id: 'over1m', label: 'Over $1M', min: 1000000, max: null },
        ];
        const _arrSelectedIds = new Set(['all']);

        function arrPresetById(id) {
          for (let i = 0; i < ARR_PRESETS.length; i++) {
            if (ARR_PRESETS[i].id === id) return ARR_PRESETS[i];
          }
          return null;
        }

        function updateArrSummary(panel) {
          const el = panel.querySelector('[data-vibe-arr-summary]');
          const toggleSum = panel.querySelector('[data-vibe-arr-toggle-summary]');
          let summary = 'Showing all ARR values';
          if (!_arrSelectedIds.has('all') && _arrSelectedIds.size > 0) {
            const labels = [];
            _arrSelectedIds.forEach(function (id) {
              const p = arrPresetById(id);
              if (p && p.id !== 'all') labels.push(p.label);
            });
            if (labels.length === 1) summary = labels[0];
            else if (labels.length > 1) summary = labels.length + ' ranges';
          } else {
            const min = parseMoneyInput(panel.querySelector('[data-vibe-arr-min]').value);
            const max = parseMoneyInput(panel.querySelector('[data-vibe-arr-max]').value);
            if (min != null || max != null) {
              summary = (min != null ? fmtCurrency(min) : 'any') + ' – ' + (max != null ? fmtCurrency(max) : 'any');
            }
          }
          const isAll = summary === 'Showing all ARR values';
          if (el) el.textContent = isAll ? '' : summary;
          if (toggleSum) toggleSum.textContent = isAll ? '' : summary;
        }

        function syncArrChipUI(panel) {
          const chips = panel.querySelectorAll('.vibe-arr-chip');
          chips.forEach(function (btn) {
            const id = btn.dataset.presetId;
            const on = _arrSelectedIds.has(id);
            btn.classList.toggle('active', on);
            btn.setAttribute('aria-pressed', on ? 'true' : 'false');
          });
          updateArrSummary(panel);
        }

        // The ARR filter can render in more than one place at once (the
        // Region accordion + the top-bar Filters modal). These helpers keep
        // every mounted panel visually in sync with the shared selection.
        function allArrPanels() {
          return document.querySelectorAll('[data-vibe-arr-panel]');
        }
        function syncAllArrPanels() {
          allArrPanels().forEach(function (p) { syncArrChipUI(p); });
        }
        function clearAllArrCustomInputs() {
          allArrPanels().forEach(function (p) {
            const mn = p.querySelector('[data-vibe-arr-min]');
            const mx = p.querySelector('[data-vibe-arr-max]');
            if (mn) mn.value = '';
            if (mx) mx.value = '';
          });
        }

        function pushArrFilters(ranges) {
          const actions = window.__renewalsActions;
          if (!actions || typeof actions.setFilters !== 'function') return;
          actions.setFilters(function (p) {
            return Object.assign({}, p, {
              arrRanges: ranges || [],
              arrMin: null,
              arrMax: null,
            });
          });
          _acctFcTotalsLastFetch = 0;
          refreshEltTiles(true);
        }

        function applyArrSelection(panel) {
          if (_arrSelectedIds.has('all') || _arrSelectedIds.size === 0) {
            pushArrFilters([]);
            return;
          }
          const ranges = [];
          _arrSelectedIds.forEach(function (id) {
            const p = arrPresetById(id);
            if (p && p.id !== 'all') ranges.push({ min: p.min, max: p.max });
          });
          pushArrFilters(ranges);
        }

        function toggleArrPreset(panel, id) {
          if (id === 'all') {
            _arrSelectedIds.clear();
            _arrSelectedIds.add('all');
          } else {
            _arrSelectedIds.delete('all');
            if (_arrSelectedIds.has(id)) _arrSelectedIds.delete(id);
            else _arrSelectedIds.add(id);
            if (_arrSelectedIds.size === 0) _arrSelectedIds.add('all');
          }
          clearAllArrCustomInputs();
          syncAllArrPanels();
          applyArrSelection(panel);
        }

        // Bridge for the React Region "Quick Filters" chips/reset: lets the
        // dashboard clear the ARR selection (a DOM-injected filter with its
        // own selection store) so both systems stay in lock-step.
        window.__renewalsResetArrFilter = function () {
          _arrSelectedIds.clear();
          _arrSelectedIds.add('all');
          clearAllArrCustomInputs();
          syncAllArrPanels();
          pushArrFilters([]);
        };

        async function loadCurrentUser() {
          if (window.RenewalsSessionLock && typeof RenewalsSessionLock.checkWhoami === 'function') {
            return RenewalsSessionLock.checkWhoami();
          }
          try {
            const res = await fetch('/api/whoami', { cache: 'no-store' });
            if (!res.ok) return;
            const data = await res.json();
            _currentUser = data.user || null;
            window.__renewalsCurrentUser = _currentUser;
            _whoamiPayload = data;
            updateUserMenu();
          } catch (_) {}
        }

        if (window.RenewalsSessionLock && typeof RenewalsSessionLock.start === 'function') {
          RenewalsSessionLock.start({
            onWhoami: function (data) {
              if (!data) return;
              _currentUser = data.user || null;
              window.__renewalsCurrentUser = _currentUser;
              _whoamiPayload = data;
              updateUserMenu();
            },
          });
        } else {
          loadCurrentUser();
          setInterval(loadCurrentUser, 60000);
        }

        let _whoamiPayload = null;
        let _userMenuOpen = false;
        let _arrSidebarOpen = false;

        function userInitials(user) {
          const src = (user && (user.displayName || user.email)) || '?';
          const parts = String(src).replace(/[._-]+/g, ' ').split(' ').filter(Boolean);
          if (!parts.length) return '?';
          if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
          return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }

        function roleLabel(role) {
          if (role === 'owner') return 'Owner';
          if (role === 'admin') return 'Admin';
          if (role === 'standard') return 'Standard';
          return 'Guest';
        }

        function canEditRawNotes() {
          const u = window.__renewalsCurrentUser;
          return !!(u && u.role === 'owner');
        }

        function ensureEditRawGate() {
          if (canEditRawNotes()) return;
          document.querySelectorAll('button').forEach(function (btn) {
            const t = (btn.textContent || '').trim();
            if (t === 'Edit raw') btn.style.display = 'none';
          });
        }

        // "Data as of" freshness indicator. Sourced from the refresh-status
        // endpoint's last-successful-refresh timestamp (data_as_of); falls
        // back to the active snapshot's effective date for CSV-only
        // deployments where no Snowflake refresh has run yet. Cached ~60s to
        // avoid re-fetching on every throttled applyAll pass.
        let _dataAsOfLastFetch = 0;
        let _dataAsOfCache = null;

        function fmtRelativeAgo(iso) {
          try {
            const then = new Date(iso).getTime();
            if (!then) return '';
            const secs = Math.max(0, (Date.now() - then) / 1000);
            if (secs < 90) return 'Updated just now';
            const mins = Math.round(secs / 60);
            if (mins < 90) return 'Updated ' + mins + 'm ago';
            const hrs = Math.round(mins / 60);
            if (hrs < 36) return 'Updated ' + hrs + 'h ago';
            return 'Updated ' + Math.round(hrs / 24) + 'd ago';
          } catch (_) { return ''; }
        }

        async function ensureDataAsOfBadge() {
          const rightBlock = document.querySelector('.header-right-block');
          if (!rightBlock) return;
          try {
            const now = Date.now();
            const stale = !_dataAsOfCache || (now - _dataAsOfLastFetch) > 60000
              || (_dataAsOfCache && _dataAsOfCache.status === 'running');
            if (stale) {
              const res = await fetch('/api/renewals/refresh-status', { cache: 'no-store' });
              if (res.ok) { _dataAsOfCache = await res.json(); _dataAsOfLastFetch = now; }
            }
            const status = _dataAsOfCache && _dataAsOfCache.status;
            const running = status === 'running';
            let asOf = _dataAsOfCache && (_dataAsOfCache.data_as_of || _dataAsOfCache.finished_at);
            // Fallback: active snapshot effective date (no refresh run yet).
            if (!asOf) {
              try {
                const pres = await fetch('/api/renewals/parsed-data?slot=active', { cache: 'no-store' });
                if (pres.ok) { const pd = await pres.json(); asOf = pd.effective_date || pd.mtime; }
              } catch (_) {}
            }
            if (!asOf && !running) return;

            let el = document.getElementById('vibe-data-asof');
            if (!el) {
              el = document.createElement('span');
              el.id = 'vibe-data-asof';
              el.className = 'pill text-[10px]';
              rightBlock.insertBefore(el, rightBlock.querySelector('#vibe-user-menu-wrap'));
            }
            const mode = (_dataAsOfCache && _dataAsOfCache.mode) ? (' · ' + _dataAsOfCache.mode) : '';
            let label = '';
            if (asOf) {
              const d = new Date(asOf);
              label = isNaN(d.getTime()) ? String(asOf).slice(0, 10) : d.toLocaleString();
            }
            if (running) {
              el.textContent = 'Refreshing…';
              el.title = (asOf ? ('Last data as of ' + label) : 'Snowflake refresh in progress') + mode;
            } else {
              el.textContent = 'Data as of ' + label;
              el.title = fmtRelativeAgo(asOf) + mode;
            }
          } catch (_) {}
        }

        function ensureUserMenu() {
          const rightBlock = document.querySelector('.header-right-block');
          if (!rightBlock) return false;

          let wrap = document.getElementById('vibe-user-menu-wrap');
          if (!wrap) {
            wrap = document.createElement('div');
            wrap.id = 'vibe-user-menu-wrap';
            wrap.className = 'vibe-user-menu-wrap';
            wrap.innerHTML =
              '<button type="button" id="vibe-admin-view-btn" title="Open admin panel">' +
                '<span aria-hidden="true">🛡</span><span>Admin</span>' +
              '</button>' +
              '<div style="position:relative">' +
                '<button type="button" id="vibe-user-menu-trigger" aria-haspopup="true" aria-expanded="false">' +
                  '<span class="vibe-user-avatar" data-vibe-user-avatar>?</span>' +
                  '<span class="vibe-user-meta">' +
                    '<span class="vibe-user-name" data-vibe-user-name>Signed in</span>' +
                    '<span class="vibe-user-role guest" data-vibe-user-role>Guest</span>' +
                  '</span>' +
                  '<span class="vibe-user-chevron" aria-hidden="true">▼</span>' +
                '</button>' +

        // Manually push any browser-local notes to the shared server. Useful
        // after a session expired and background saves were silently rejected.
        let _resyncInFlight = false;
        async function resyncLocalNotes() {
          if (_resyncInFlight) return;
          _resyncInFlight = true;
          try {
            const peek = window.__renewalsPeekState && window.__renewalsPeekState();
            const notes = (peek && peek.notes) || {};
            const noteDeletes = (peek && peek.noteDeletes) || {};
            const noteCount = Object.keys(notes).length;
            if (!noteCount && !Object.keys(noteDeletes).length) {
              alert('You have no notes on this device to re-sync.');
              return;
            }
            // Confirm the session is still valid before attempting the write.
            let signedIn = false;
            try {
              const who = await fetch('/api/whoami', { cache: 'no-store' });
              if (who.ok) {
                const wd = await who.json();
                const role = wd && wd.user && wd.user.role;
                signedIn = role === 'standard' || role === 'admin' || role === 'owner';
              }
            } catch (_) {}
            if (!signedIn) {
              if (window.RenewalsSessionLock && typeof window.RenewalsSessionLock.showLock === 'function') {
                window.RenewalsSessionLock.showLock(
                  'You need to sign in again before your notes can be saved. Refresh the page to sign in, then use "Re-sync my notes" again.'
                );
              } else {
                alert('You appear to be signed out. Please refresh the page to sign in, then try Re-sync again.');
              }
              return;
            }
            const res = await fetch('/api/renewals/notes', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ notes: notes, noteDeletes: noteDeletes }),
            });
            if (res.status === 401) {
              if (window.RenewalsSessionLock && typeof window.RenewalsSessionLock.showLock === 'function') {
                window.RenewalsSessionLock.showLock(
                  'Your secure session expired. Refresh the page to sign in again, then use "Re-sync my notes".'
                );
              } else {
                alert('Your session expired. Please refresh and sign in, then try Re-sync again.');
              }
              return;
            }
            if (!res.ok) {
              alert('Re-sync failed (server said ' + res.status + '). Please try again in a moment.');
              return;
            }
            const data = await res.json().catch(() => ({}));
            const serverTotal = data && data.noteCount != null ? data.noteCount : null;
            const denied = data && Array.isArray(data.deniedKeys) ? data.deniedKeys.length : 0;
            let msg = 'Re-sync complete. Your ' + noteCount + ' note' + (noteCount === 1 ? '' : 's') + ' on this device ' + (noteCount === 1 ? 'was' : 'were') + ' sent to the shared server.';
            if (serverTotal != null) {
              msg += '\n\nThe shared server now has ' + serverTotal + ' note' + (serverTotal === 1 ? '' : 's') + ' total.';
            }
            if (denied > 0) {
              msg += '\n\nNote: ' + denied + ' note' + (denied === 1 ? '' : 's') + ' could not be updated because they belong to another user (only an admin can edit those).';
            }
            alert(msg);
          } catch (err) {
            alert('Re-sync failed: ' + (err && err.message ? err.message : 'unknown error') + '. Please try again.');
          } finally {
            _resyncInFlight = false;
          }
        }

        // ---- Planning data → Postgres (targets, rates, budgets, expansion) --
        const PLANNING_PUT_MS = 800;
        let _planningLoaded = false;
        let _planningLoadStarted = false;
        let _planningSuppressPut = false;
        let _planningLastPut = '';
        let _planningPutTimer = null;

        function planningPayloadFromPeek() {
          const peek = window.__renewalsPeekState && window.__renewalsPeekState();
          if (!peek) return null;
          return {
            targets: peek.targets || {},
            rateTargets: peek.rateTargets || {},
            ccData: peek.ccData || {},
            expansionTargets: peek.expansionTargets || {},
          };
        }

        function planningHasData(obj) {
          if (!obj) return false;
          return !!(
            Object.keys(obj.targets || {}).length ||
            Object.keys(obj.rateTargets || {}).length ||
            Object.keys(obj.ccData || {}).length ||
            Object.keys(obj.expansionTargets || {}).length
          );
        }

        function applyPlanningData(data) {
          const actions = window.__renewalsActions;
          if (!actions) return;
          _planningSuppressPut = true;
          try {
            if (data.targets && actions.setTargets) actions.setTargets(data.targets);
            if (data.rateTargets && actions.setRateTargets) actions.setRateTargets(data.rateTargets);
            if (data.ccData && actions.setCcData) actions.setCcData(data.ccData);
            if (data.expansionTargets && actions.setExpansionTargets) {
              actions.setExpansionTargets(data.expansionTargets);
            }
          } finally {
            _planningSuppressPut = false;
          }
        }

        function schedulePlanningPut() {
          if (_planningSuppressPut || !_planningLoaded) return;
          const payload = planningPayloadFromPeek();
          if (!payload) return;
          let serialized;
          try { serialized = JSON.stringify(payload); } catch (_) { return; }
          if (serialized === _planningLastPut) return;
          clearTimeout(_planningPutTimer);
          _planningPutTimer = setTimeout(async function () {
            try {
              const res = await fetch('/api/renewals/planning-data', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: serialized,
              });
              if (!res.ok) return;
              const json = await res.json();
              if (json && json.ok) _planningLastPut = serialized;
            } catch (_) {}
          }, PLANNING_PUT_MS);
        }

        function wrapPlanningActions(actions) {
          if (!actions || actions.__planningWrapped) return;
          function wrap(original) {
            if (typeof original !== 'function') return original;
            return function () {
              const r = original.apply(this, arguments);
              schedulePlanningPut();
              return r;
            };
          }
          actions.setTargets = wrap(actions.setTargets);
          actions.setRateTargets = wrap(actions.setRateTargets);
          actions.setCcData = wrap(actions.setCcData);
          actions.setExpansionTargets = wrap(actions.setExpansionTargets);
          actions.__planningWrapped = true;
        }

        async function loadPlanningData() {
          if (_planningLoadStarted) return;
          _planningLoadStarted = true;
          try {
            const res = await fetch('/api/renewals/planning-data', { cache: 'no-store' });
            if (!res.ok) throw new Error('planning ' + res.status);
            const remote = await res.json();
            const local = planningPayloadFromPeek();
            const remoteHas = remote && remote.savedAt && planningHasData(remote);
            const localHas = planningHasData(local);

            if (remoteHas) {
              applyPlanningData(remote);
              try {
                _planningLastPut = JSON.stringify({
                  targets: remote.targets || {},
                  rateTargets: remote.rateTargets || {},
                  ccData: remote.ccData || {},
                  expansionTargets: remote.expansionTargets || {},
                });
              } catch (_) {}
            } else if (localHas) {
              schedulePlanningPut();
            }
          } catch (_) {}
          _planningLoaded = true;
        }

        function ensurePlanningSync() {
          const actions = window.__renewalsActions;
          if (!actions) return false;
          wrapPlanningActions(actions);
          if (!_planningLoaded) loadPlanningData();
          return true;
        }

        function parseMoneyInput(raw) {
          if (raw == null || raw === '') return null;

        function fmtDelta(curr, base) {
          if (curr == null || base == null || !isFinite(curr) || !isFinite(base)) {
            return { text: '', cls: 'vibe-delta-flat' };
          }
          const d = curr - base;
          if (Math.abs(d) < 1) return { text: 'No change vs saved', cls: 'vibe-delta-flat' };
          const sign = d > 0 ? '+' : '';
          const cls = d > 0 ? 'vibe-delta-up' : 'vibe-delta-down';
          const word = d > 0 ? 'increasing' : 'reducing';
          return { text: sign + fmtCurrency(d) + ' (' + word + ' forecast)', cls: cls };
        }

        function getFilteredAccountNames() {
          if (typeof window.__renewalsFilteredAccountNames === 'function') {
            return window.__renewalsFilteredAccountNames() || [];
          }
          return [];
        }

        function isForecastScopeActive() {
          return typeof window.__renewalsScopedAccountIds === 'function';
        }

        function getGlobalFilteredAccountIds() {
          if (typeof window.__renewalsFilteredAccountIds === 'function') {
            return window.__renewalsFilteredAccountIds() || [];
          }
          return getFilteredAccountNames();
        }

        function getForecastCallKeys() {
          if (typeof window.__renewalsScopedCallKeys === 'function') {
            return window.__renewalsScopedCallKeys() || [];
          }
          const peek = window.__renewalsPeekState && window.__renewalsPeekState();
          if (!peek || !peek.data || !window.RenewalsCallKeys) return [];
          const hm = peek.headerMap || {};
          const settings = peek.settings || {};
          const keys = [];
          const seen = {};
          (peek.data || []).forEach(function (r) {
            const ck = RenewalsCallKeys.buildCallKey(r, hm, settings);
            if (ck && !seen[ck]) {
              seen[ck] = true;
              keys.push(ck);
            }
          });
          return keys;
        }

        function acctFcScopeKey() {
          const scoped = isForecastScopeActive();
          const keys = getForecastCallKeys();
          if (scoped && keys.length) {
            const sorted = keys.slice().sort();
            let h = 2166136261;
            for (let i = 0; i < sorted.length; i++) {
              const s = sorted[i];
              for (let j = 0; j < s.length; j++) {
                h ^= s.charCodeAt(j);
                h = Math.imul(h, 16777619);
              }
            }
            return 'ck:' + sorted.length + ':' + (h >>> 0).toString(16);
          }
          const ids = getForecastAccountIds();
          if (scoped && !ids.length) return 'scoped:0';
          if (!ids.length) return '__global__';
          const sorted = ids.slice().sort();
          let h = 2166136261;
          for (let i = 0; i < sorted.length; i++) {
            const s = sorted[i];
            for (let j = 0; j < s.length; j++) {
              h ^= s.charCodeAt(j);
              h = Math.imul(h, 16777619);
            }
          }
          return sorted.length + ':' + (h >>> 0).toString(16);
        }

        function isDashboardFiltered() {
          const ids = getForecastAccountIds();
          const baseline = getGlobalFilteredAccountIds();
          const total = baseline.length;
          if (total <= 0) {
            const peek = window.__renewalsPeekState && window.__renewalsPeekState();
            const dataLen = peek && peek.data ? peek.data.length : 0;
            return dataLen > 0 && ids.length > 0 && ids.length < dataLen;
          }
          return total > 0 && ids.length > 0 && ids.length < total;
        }

        async function loadAcctFcTotals(force) {
          const scopeKey = acctFcScopeKey();
          if (scopeKey !== _acctFcTotalsScopeKey) {
            _acctFcTotalsScopeKey = scopeKey;
            _acctFcTotalsCache = null;
            _acctFcTotalsLastFetch = 0;
            force = true;
          }
          const now = Date.now();
          if (!force && _acctFcTotalsCache && (now - _acctFcTotalsLastFetch) < ACCT_FC_TTL_MS) {
            return _acctFcTotalsCache;
          }
          const ids = getForecastAccountIds();
          const callKeys = getForecastCallKeys();
          if (isForecastScopeActive() && callKeys.length === 0 && ids.length === 0) {
            _acctFcTotalsCache = {
              cs_total: 0,
              renewals_total: 0,
              cs_count: 0,
              renewals_count: 0,
            };
            _acctFcTotalsLastFetch = now;
            return _acctFcTotalsCache;
          }
          try {
            const body = callKeys.length ? { call_keys: callKeys } : { account_ids: ids };
            const res = await fetch('/api/renewals/account-forecasts/totals', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              cache: 'no-store',
              body: JSON.stringify(body),
            });
            if (!res.ok) return _acctFcTotalsCache || null;
            const data = await res.json();
            _acctFcTotalsCache = data;
            _acctFcTotalsLastFetch = now;
          } catch (_) { /* silent */ }
          return _acctFcTotalsCache;
        }

        async function saveAcctFc(payload) {
          if (!payload || !payload.account_id) return null;
          try {
            const res = await fetch(

                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(Object.assign({ source: 'modal_done' }, payload)),
              },
            );
            if (!res.ok) return null;
            _acctFcTotalsCache = null;
            _acctFcTotalsLastFetch = 0;
            try { window.dispatchEvent(new CustomEvent('renewals-acctfc-changed')); } catch (_) {}
            return await res.json();
          } catch (_) { return null; }
        }

        async function loadAcctFcForRow(ctx) {
          if (!ctx || !ctx.account_id) return null;
          try {
            const qs = new URLSearchParams();
            if (ctx.call_key) qs.set('call_key', ctx.call_key);
            else {
              if (ctx.year_quarter) qs.set('year_quarter', ctx.year_quarter);
              if (ctx.rounded_atr != null) qs.set('rounded_atr', String(ctx.rounded_atr));
            }
            const res = await fetch(
              '/api/renewals/account-forecasts/' + encodeURIComponent(ctx.account_id) +
              (qs.toString() ? '?' + qs.toString() : ''),
              { cache: 'no-store' },
            );
            if (!res.ok) return null;
            return await res.json();
          } catch (_) { return null; }
        }

        function fmtCurrency(n) {
          if (n == null) return '—';
          if (Math.abs(n) >= 1_000_000) return '$' + (n / 1_000_000).toFixed(2) + 'M';
          if (Math.abs(n) >= 1_000) return '$' + (n / 1_000).toFixed(1) + 'K';
          return '$' + Math.round(n);
        }

        function fmtVarianceText(n) {
          if (n == null) return '—';
          const sign = n > 0 ? '+' : '';
          return sign + fmtCurrency(n);
        }

        function varianceColor(n) {
          if (n == null) return '#6b7280';
          const abs = Math.abs(n);
          if (abs < 1) return '#10b981';
          if (abs > 100_000) return '#ef4444';
          return '#f59e0b';
        }

        // ---- KPI tiles (CS Call / Renewals Call / ELT Call computed) ----

        // The dashboard's KPI strip is a grid of tiles, each tile has a
        // small uppercase label followed by a big bold value. We need to
        // find the GRID CONTAINER (not a tile), and append our tiles to
        // the parent of the grid as a clean separate row below.

        // Stable label texts the dashboard renders in the KPI strip. We
        // use these to identify the strip's bounds.
        const KPI_LABELS = [
          'TOTAL ATR', 'BOOKED C/C', 'REMAINING C/C',
          'EXPECTED C/C', 'ELT FC', 'REVIEWED',
        ];

        function findKpiGrid() {
          const explicit = document.getElementById('region-kpi-grid');
          if (explicit) return explicit;
          // 1. Find each KPI label's leaf element.
          const labelEls = [];
          for (const txt of KPI_LABELS) {
            const els = document.querySelectorAll('div, span, p');
            for (const el of els) {
              if (el.children.length) continue;
              if ((el.textContent || '').trim().toUpperCase() === txt) {
                labelEls.push(el);
                break;
              }
            }
          }
          if (labelEls.length < 3) return null;

          // 2. Walk up from each label to find its TILE (the small card
          //    that contains label + value + subtitle). The tile is the
          //    deepest ancestor of the label that is also a grid item —
          //    i.e. whose PARENT contains multiple sibling tiles.
          const tileEls = labelEls.map(function (lab) {
            let cur = lab;
            let depth = 0;
            while (cur && cur.parentElement && depth < 6) {
              const siblings = cur.parentElement.children;
              if (siblings.length >= 3) {
                // Confirm the siblings look like a row of tiles by
                // checking that other labels live under them.
                let matches = 0;
                for (const sib of siblings) {
                  for (const otherLab of labelEls) {
                    if (otherLab !== lab && sib.contains(otherLab)) { matches++; break; }
                  }
                }
                if (matches >= 2) return cur.parentElement;
              }
              cur = cur.parentElement;
              depth++;
            }
            return null;
          }).filter(Boolean);

          if (!tileEls.length) return null;
          // The most common ancestor across all tiles IS the grid.
          // (All tiles share the same parent container in the strip.)
          const grid = tileEls[0];
          // Sanity: it should contain at least 3 of our labels.
          let hits = 0;
          for (const lab of labelEls) if (grid.contains(lab)) hits++;
          if (hits < 3) return null;
          return grid;
        }

        // The wrapper row we insert. We place it as a SIBLING of the
        // grid (not inside it), with our own grid layout, so the dashboard's
        // tiles stay untouched and ours appear as a clearly-distinct second
        // row below them.
        function ensureEltKpiRow() {
          const grid = findKpiGrid();
          if (!grid) return false;
          const host = document.getElementById('region-top-stack') || grid.closest('.region-main-panel') || grid.parentElement;
          if (!host) return false;
          let row = document.getElementById('vibe-elt-row');
          if (row) return true; // already injected

          row = document.createElement('div');
          row.id = 'vibe-elt-row';
          row.style.cssText = (
            'width:100%;' +
            'display:grid;' +
            'grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));' +
            'gap:14px;'
          );
          row.innerHTML = `
            <div class="vibe-tile" style="background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,23,42,.06)">

              <div data-vibe-val="cs"  style="font-size:22px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;color:#0ea5e9">$0</div>
              <div data-vibe-sub="cs"  style="font-size:11px;color:#6b7280;margin-top:4px">Customer Success rollup</div>
            </div>

              <div style="font-size:10px;font-weight:600;color:#6b7280;letter-spacing:.05em;text-transform:uppercase">Renewals Call</div>
              <div data-vibe-val="rn"  style="font-size:22px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;color:#8b5cf6">$0</div>
              <div data-vibe-sub="rn"  style="font-size:11px;color:#6b7280;margin-top:4px">Renewals team rollup</div>
            </div>
            <div class="vibe-tile" style="background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,23,42,.06)">
              <div style="font-size:10px;font-weight:600;color:#6b7280;letter-spacing:.05em;text-transform:uppercase">ELT Call (sum)</div>
              <div data-vibe-val="elt" style="font-size:22px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums">$0</div>
              <div data-vibe-sub="variance" style="font-size:11px;margin-top:4px;color:#6b7280">CS vs Renewals alignment</div>
            </div>
          `;
          // Insert as the next full-width row in the main panel stack.
          if (grid.nextSibling) host.insertBefore(row, grid.nextSibling);

          return true;
        }

        function applyEltKpiValues() {
          const row = document.getElementById('vibe-elt-row');
          if (!row) return;
          let cs, rn, elt, csCount, rnCount, djCount;
          if (typeof window.__renewalsScopedCallRollup === 'function') {
            const r = window.__renewalsScopedCallRollup();
            cs = r.cs_total || 0;
            rn = r.renewals_total || 0;
            elt = r.elt_total != null ? r.elt_total : cs + rn;
            csCount = r.cs_count || 0;
            rnCount = r.renewals_count || 0;
            djCount = r.dj_override_count || 0;
          } else {
            const t = _acctFcTotalsCache || {};
            cs = t.cs_total || 0;
            rn = t.renewals_total || 0;
            elt = cs + rn;
            csCount = t.cs_count || 0;
            rnCount = t.renewals_count || 0;
            djCount = 0;
          }
          const variance = cs - rn;
          const filtered = isDashboardFiltered();

          // Only touch the DOM when a value actually changes. Writing
          // identical textContent still registers a mutation, which the
          // MutationObserver would see and re-schedule applyAll — an idle
          // self-trigger loop. Guarding stops that.
          const setText = function (sel, val) {
            const el = row.querySelector(sel);
            if (el && el.textContent !== val) el.textContent = val;
          };
          setText('[data-vibe-val="cs"]', fmtCurrency(cs));
          setText('[data-vibe-val="rn"]', fmtCurrency(rn));
          setText('[data-vibe-val="elt"]', fmtCurrency(elt));

            rnCount === 0 ? 'No Renewals Forecasts in current view'
                          : 'Renewals rollup · ' + rnCount + ' account(s)' + (filtered ? ' · filtered view' : ''));
          const varianceEl = row.querySelector('[data-vibe-sub="variance"]');
          if (varianceEl) {
            let vText, vColor;
            if (cs === 0 && rn === 0 && elt === 0) {
              vText = 'CS vs Renewals — enter values in any account modal';
              vColor = '#6b7280';
            } else if (cs === 0 && rn === 0 && djCount > 0) {
              vText = 'ELT overrides · ' + djCount + ' account(s) · no CS/RN split yet';
              vColor = '#6b7280';
            } else {
              vText = 'CS vs Renewals: ' + fmtVarianceText(variance);
              vColor = varianceColor(variance);
            }
            if (varianceEl.textContent !== vText) varianceEl.textContent = vText;
            if (varianceEl.style.color !== vColor) varianceEl.style.color = vColor;
          }
        }

        async function refreshEltTiles(force) {

        // ---- Account modal injection ------------------------------------

        function getEltForecastInput() {
          // The modal renders the ELT FORECAST input next to "= BU FC"

          const modal = document.querySelector('.acct-modal-main') || document.querySelector('.acct-modal-panel');
          if (!modal) return null;
          const inputs = modal.querySelectorAll('input[type="text"], input[type="number"], input:not([type])');
          for (const inp of inputs) {
            const parent = inp.parentElement;
            if (!parent) continue;
            const siblings = parent.querySelectorAll('button');
            for (const btn of siblings) {
              const t = (btn.textContent || '').trim();
              if (t === '= BU FC' || t === 'Flat') return inp;
            }
          }
          return null;
        }

        function dispatchReactInput(input, value) {

          // synthetic event system actually picks up. Without this,
          // input.value = 'X' silently bypasses React's state.
          const proto = window.HTMLInputElement && HTMLInputElement.prototype;
          const setter = proto && Object.getOwnPropertyDescriptor(proto, 'value').set;
          if (setter) setter.call(input, value);
          else input.value = value;
          input.dispatchEvent(new Event('input', { bubbles: true }));
          input.dispatchEvent(new Event('change', { bubbles: true }));
        }

        function ensureAcctModalInjection() {

          const row = document.createElement('div');

          row.style.cssText =
            'display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;';
          row.innerHTML = `
            <div>
              <div style="font-size:10px;font-weight:600;color:#6b7280;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px">CS Forecast</div>
              <input type="text" inputmode="decimal" data-vibe-money-input data-vibe-cs-input
                     style="width:100%;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;font:inherit;font-size:13px;text-align:right;font-variant-numeric:tabular-nums"
                     placeholder="—" />
              <div class="vibe-meta-line" data-vibe-cs-meta></div>
              <div class="vibe-meta-line" data-vibe-cs-delta></div>

            <div>
              <div style="font-size:10px;font-weight:600;color:#6b7280;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px">Renewals Forecast</div>
              <input type="text" inputmode="decimal" data-vibe-money-input data-vibe-rn-input
                     style="width:100%;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;font:inherit;font-size:13px;text-align:right;font-variant-numeric:tabular-nums"
                     placeholder="—" />

              <strong>ELT Forecast</strong> = CS + Renewals (read-only below). Calls save when you click <strong>Done</strong>.

          modal.__vibeCommitCalls = async function () {

              : '';
            recomputeAndPushElt();

            status.textContent = data.effective_date
              ? 'Last commit: ' + new Date(data.effective_date).toLocaleString()
              : '';

        function enforceNoteOwnership(modal, accountName) {
          const peek = window.__renewalsPeekState && window.__renewalsPeekState();

          const note = noteKey ? notes[noteKey] : null;

        function applyAll() {

            ensureDataAsOfBadge();
            sanitiseBlocklisted();
            // Re-apply ELT tile values after React re-renders the KPI grid.
            // NOT forced: this reuses the cached totals (and only refetches
            // when the filter scope actually changed). Forcing here made the
            // app POST /account-forecasts/totals on every DOM mutation.
            refreshEltTiles(false);
            // NOTE: account-card CS/Renewals inputs are now rendered natively
            // by the React modal (app.js). The old DOM injection here produced
            // a duplicate set of fields, so it is intentionally disabled.
            // ensureAcctModalInjection();
          } catch (e) {
            try { console.warn('[vibe injection] applyAll error', e); } catch (_) {}
          } finally {
            _applyInFlight = false;
            try {
              _mo && _mo.observe(document.body, { childList: true, subtree: true });
            } catch (_) {}
          }
        }

        function scheduleApplyAll() {
          // Coalesce mutation bursts. Run at most once per
          // APPLY_THROTTLE_MS — that's enough latency to not feel laggy
          // (≈ 2 fps for cosmetic injections) but vastly cheaper than
          // running on every mutation (which can be hundreds per second
          // while React re-renders large grids).
          const now = Date.now();
          if (_applyTimer) return;
          const delay = Math.max(0, _scheduledApplyAt - now);
          _applyTimer = setTimeout(function () {
            _applyTimer = null;
            _scheduledApplyAt = Date.now() + APPLY_THROTTLE_MS;
            applyAll();
          }, delay || APPLY_THROTTLE_MS);
        }

        // First pass: try every 500 ms until the topbar mounts. We don't
        // need to spam this — the React app takes >1 s to mount anyway.
        const earlyInterval = setInterval(function () {
          if (ensureUserMenu()) {
            sanitiseBlocklisted();
            clearInterval(earlyInterval);
          }
        }, 500);
        setTimeout(function () { clearInterval(earlyInterval); }, 15000);

        // Long-term: re-apply when React re-renders. The observer is
        // throttled via scheduleApplyAll to keep CPU cost bounded.
        const _mo = new MutationObserver(scheduleApplyAll);
        _mo.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
